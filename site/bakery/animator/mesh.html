<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cut-out vs bending</title>
<style>
  body{margin:0;background:#fdf0df;color:#5d5049;font:15px/1.4 system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:20px 12px 40px}
  h1{font:600 22px system-ui;margin:4px 0 2px}p{margin:0 0 14px;color:#8a7768;text-align:center;max-width:560px}
  .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:6px 0}
  button{border:2px solid #e6d3bd;background:#fff;border-radius:999px;padding:7px 13px;font:600 13px system-ui;color:#5d5049;cursor:pointer}
  button.on{background:#f2b25c;border-color:#c98d3a}
  .stage{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-top:12px}
  figure{margin:0;background:#fffaf2;border:2px solid #ead9c4;border-radius:20px;padding:10px;text-align:center}
  figcaption{font:600 13px system-ui;margin-top:4px}figcaption small{display:block;font-weight:400;color:#8a7768}
  canvas{width:min(44vw,380px);height:min(44vw,380px);display:block}
</style>
</head>
<body>
<h1>Cut-out puppet vs one bending picture</h1>
<p>Same character, same action. Left: today’s rig (separate pieces). Right: the whole character as one image that bends, squashes and wobbles.</p>
<div class="row" id="who"></div>
<div class="row" id="act"></div>
<div class="stage">
  <figure><canvas id="a" width="760" height="760"></canvas><figcaption>Cut-out pieces<small>today</small></figcaption></figure>
  <figure><canvas id="b" width="760" height="760"></canvas><figcaption>One bending picture<small>new</small></figcaption></figure>
</div>
<script src="rig.js"></script>
<script src="mesh.js"></script>
<script>
const CH = [['dot', 'Mango'], ['bun', 'Bun'], ['mo', 'Mo'], ['hazel', 'Hazel'], ['pip', 'Pip'], ['cat', 'Tango']];
const ACTS = ['idle', 'walkSide', 'wave', 'cheer', 'hop', 'dance', 'excited', 'impatient', 'bow', 'doze', 'turn', 'spin', 'lookAround', 'walkAway'];
const LEN = {walkSide: .7, walkAway: .7, spin: 3.2, turn: 2.4, lookAround: 4, idle: 2.6};
const cache = {}; let who = new URLSearchParams(location.search).get('c') || 'dot', act = new URLSearchParams(location.search).get('a') || 'idle';
async function load(c) {
  if (cache[c]) return cache[c];
  const im = new Image(); im.src = `../art/rig/${c}.png`; await im.decode();
  const s = document.createElement('canvas'); s.width = im.width; s.height = im.height; s.getContext('2d').drawImage(im, 0, 0);
  const rig = BakeryRig.partsFromSheet(s, null, 0); return cache[c] = {rig, mesh: BakeryMesh.build(rig, 640)};
}
function chips() {
  document.getElementById('who').innerHTML = CH.map(([k, n]) => `<button data-c="${k}" class="${k === who ? 'on' : ''}">${n}</button>`).join('');
  document.getElementById('act').innerHTML = ACTS.map(a => `<button data-a="${a}" class="${a === act ? 'on' : ''}">${a}</button>`).join('');
}
document.body.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.c) { who = b.dataset.c; load(who); } if (b.dataset.a) act = b.dataset.a; chips(); });
chips(); load(who);
const A = document.getElementById('a').getContext('2d'), B = document.getElementById('b').getContext('2d');
function frame(ms) {
  const c = cache[who], t = (ms/1000/(LEN[act] || 1.6)) % 1;
  A.clearRect(0, 0, 760, 760); B.clearRect(0, 0, 760, 760);
  if (c) {
    BakeryRig.drawAny(c.rig, BakeryRig.poseFor(c.rig, act, t), A, 760, 760);
    BakeryMesh.draw(c.mesh, BakeryMesh.poseFor(act, t), B, 0, 0, 760, 760);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
