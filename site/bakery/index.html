<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bakery">
<meta name="theme-color" content="#fdf0df">
<link rel="manifest" id="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Bingsu's Bakery</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf3e8;--card:#fffaf2;--line:#ecdcc8;--line2:#dcc6ab;--ink:#5d5049;--text:#5d5049;--muted:#9a8676;--accent:#f2b25c;--accent-d:#d98f2f;--good:#4c9a3c;--bad:#d9534f;--idle:#6f82b8;--panel:#fffaf2}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
small{color:var(--muted)}
.muted{color:var(--muted);margin:0 0 10px;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* header */
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:24px;padding:12px 28px;background:#fffaf2ee;backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;white-space:nowrap}.brandname{font-family:Fredoka,system-ui,sans-serif;font-weight:600;font-size:21px;color:#c46a7a;letter-spacing:.01em}.brand img{width:36px;height:36px;border-radius:11px;border:1px solid var(--line)}
.kpis{display:flex;gap:26px;margin:0 auto}
.kpi{display:flex;flex-direction:column;line-height:1.15}.kpi small{font-size:11px;text-transform:uppercase;letter-spacing:.06em}.kpi b{font-size:17px;white-space:nowrap}.kpi em{font-style:normal;font-size:11px;color:var(--muted)}
.who{display:flex;gap:10px;align-items:center}
.chip-state{display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:14px;white-space:nowrap}
.chip-state i{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.chip-state:has(.focused) i{background:var(--good)}.chip-state:has(.distracted) i{background:var(--bad)}.chip-state:has(.grace) i{background:var(--accent)}.chip-state:has(.idle) i{background:var(--idle)}
/* layout */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;max-width:1320px;margin:0 auto;padding:24px 28px 48px}
.stage{display:flex;flex-direction:column;gap:16px;min-width:0}
canvas{width:100%;aspect-ratio:16/9;border-radius:22px;display:block;box-shadow:0 12px 32px #5d50491f;border:1px solid var(--line)}
.side{display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;box-shadow:0 2px 10px #5d50490b}
.card h3{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.row{display:flex;gap:8px}.chips{display:flex;flex-wrap:wrap;gap:8px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#recipes>small{display:none}
.skins{display:flex;gap:8px;flex-wrap:wrap}.skins button{width:42px;height:42px;padding:0;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line2)}.skins button.on{box-shadow:0 0 0 3px var(--accent-d)}
.dev summary{cursor:pointer;color:var(--muted);font-size:13px}.dev[open] summary{margin-bottom:10px}.dev .chips+.chips{margin-top:8px}
/* controls */
button{font:inherit;background:#fff;color:var(--ink);border:1px solid var(--line2);border-radius:12px;padding:8px 12px;cursor:pointer;transition:background .15s,border-color .15s,transform .1s}
button:hover{background:#fff6ea;border-color:#cdb293}button:active{transform:translateY(1px)}
button.on{background:#fde7c4;border-color:var(--accent-d);color:#5a3a12;font-weight:600}
button.locked{opacity:.7}
button.primary{background:var(--accent);border-color:var(--accent-d);color:#3a2610;font-weight:700}button.primary:hover{background:#f5be72}
button.link{background:none;border:0;padding:8px 0 0;color:#a8651a;font-weight:600}button.link:hover{text-decoration:underline;background:none}
input{font:inherit;background:#fff;color:var(--ink);border:1px solid var(--line2);border-radius:12px;padding:9px 12px;width:100%;min-width:0}
input:focus{outline:3px solid #f2b25c55;border-color:var(--accent-d)}
select{font:inherit;background:#fff;color:var(--ink);border:1px solid var(--line2);border-radius:12px;padding:8px 10px;width:100%;margin-top:8px}
.focused{color:var(--good)}.distracted{color:var(--bad)}.idle{color:var(--idle)}.grace{color:var(--accent-d)}
/* sheet (dialogs) */
#sheet{position:fixed;inset:0;z-index:40;background:#3a2c2266;display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow:auto;backdrop-filter:blur(2px)}
#sheet[hidden]{display:none}
.sheet-box{position:relative;width:min(620px,100%);background:var(--card);border-radius:22px;box-shadow:0 20px 60px #3a2c2240;padding:26px 26px 22px}
.sheet-box .x{position:absolute;top:14px;right:14px;border-radius:50%;width:36px;height:36px;padding:0}
.panel{line-height:1.55}.panel h2{margin:0 0 6px;font-size:22px}
@media (max-width:1100px){.kpis{gap:16px}.kpi:nth-child(5){display:none}}
@media (max-width:900px){.layout{grid-template-columns:1fr;padding:16px}.kpis{display:none}.top{padding:10px 16px}}
/* phone: full-screen bakery with the task at the bottom */
#phoneBar,#gear{display:none}
body.phone{background:#fdf0df;padding:0;gap:0;min-height:100dvh;justify-content:center;overflow:hidden}
body.phone .top,body.phone .side,body.phone #job{display:none!important}
body.phone .layout,body.phone .stage{display:contents}
body.phone{display:flex;flex-direction:column;align-items:center}
body.phone canvas{border:0;box-shadow:none}
body.phone canvas{width:min(100vw,177.7dvh);border-radius:0;margin-bottom:max(110px,14dvh)}

body.phone #phoneBar{display:block;position:fixed;left:0;right:0;bottom:0;padding:14px 20px calc(16px + env(safe-area-inset-bottom));background:#fffaf2;border-top:3px solid #5d5049;color:#5d5049;text-align:center}
#phoneTask{font:700 clamp(18px,5vw,26px)/1.25 system-ui;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#phoneTask.empty{color:#b7a391;font-weight:500}
#todolist{display:flex;flex-direction:column;gap:2px;max-height:260px;overflow:auto}
.titem{display:flex;align-items:center;gap:10px;padding:6px 6px;border-radius:10px}
.titem:hover{background:#fbefe0}.titem .check{width:22px;height:22px}
.titem .tt{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;font:inherit;color:inherit;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.titem .tt:hover{text-decoration:underline;background:none}.titem .src{font-size:11px;color:var(--muted)}
.titem .x{border:0;background:none;color:var(--muted);padding:0 4px;visibility:hidden}.titem:hover .x{visibility:visible}
.titem:has(.check:hover) .tt{text-decoration:line-through;color:var(--muted)}
.addrow input{margin-top:6px;border-style:dashed}.tdfoot{display:flex;justify-content:space-between;align-items:center}.empty-todo{color:var(--muted);font-size:13px;padding:4px 6px}
#phoneNext{margin-top:6px;font:500 13px system-ui;color:#8a7768}
#phoneDone{margin-top:10px;background:#8fd07c;color:#1f3b16;border:2px solid #5d5049;border-radius:999px;font-weight:700;padding:8px 18px}
.taskrow{display:flex;align-items:center;gap:10px}
button.check{flex:none;width:26px;height:26px;padding:0;border-radius:50%;border:2px solid #b9a08a;background:#fff;position:relative}
button.check::after{content:'✓';position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-weight:800;color:#4c9a3c;opacity:0;transition:opacity .15s}
button.check:hover{border-color:#4c9a3c;background:#eef8ea}button.check:hover::after{opacity:1}
.taskrow:has(button.check:hover) input{text-decoration:line-through;color:var(--muted)}
.lbl{display:block;margin:12px 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
#phoneSub{font:500 13px system-ui;color:#8a7768;margin-top:4px}
#phoneProg{height:6px;background:#f1e2cf;border-radius:3px;margin-top:8px;overflow:hidden}#phoneProg i{display:block;height:100%;background:#f2b25c}
#install{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top));z-index:5;background:#fffaf2;color:#5d5049;border-color:#5d5049}

#caseBtn{display:none}
#update{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom));z-index:30;background:#f2b25c;color:#2a211c;border-color:#5d5049;font-weight:700}
#update[hidden]{display:none}
#breakBar{position:fixed;left:8px;right:8px;bottom:calc(30px + env(safe-area-inset-bottom));z-index:13;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;max-width:700px;margin:0 auto;background:#fffaf2ee;border:2px solid #5d5049;border-radius:18px;padding:8px 10px;box-shadow:0 6px 20px #5d504926}
#breakBar[hidden],#invBar[hidden]{display:none}#invBar{position:fixed;left:8px;right:8px;bottom:calc(30px + env(safe-area-inset-bottom));z-index:14;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:560px;margin:0 auto;background:#fffaf2f2;border:2px solid #5d5049;border-radius:18px;padding:8px 10px;box-shadow:0 6px 20px #5d504926}#invBar span{font-weight:600;padding:0 4px}#invBar button{border-radius:999px;padding:7px 12px}#breakBar button{border-radius:999px;padding:7px 12px;white-space:nowrap;flex:none}
/* display case */
#case{position:fixed;inset:0;z-index:20;background:#fbf3e8;color:#5d5049;overflow:auto;padding:calc(22px + env(safe-area-inset-top)) max(18px, calc(50vw - 520px)) 30px;font-family:system-ui}
#case .close{right:max(14px, calc(50vw - 520px))}
#case[hidden]{display:none}
#case h2{margin:0 0 4px;font-size:24px}#case .sub{color:#8a7768;margin:0 0 14px}
#case .close{position:fixed;top:calc(12px + env(safe-area-inset-top));right:14px;background:#fffaf2;color:#5d5049;border-color:#5d5049}
#case .shelf{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-end;min-height:64px;padding:10px 12px 6px;border-bottom:8px solid #d9a066;border-radius:6px;background:#fff6ea;margin-bottom:18px}
#case .shelf img{height:46px}
#case .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
#case .card{background:#fffaf2;border:3px solid #5d5049;border-radius:16px;padding:12px;text-align:center}
#case .card img{height:72px;max-width:100%;object-fit:contain}
#case .card.locked img{filter:brightness(0);opacity:.18}
#case .card b{display:block;font-size:17px;margin-top:6px}#case .card small{color:#8a7768;display:block}
#case .stars{color:#e0533f;letter-spacing:2px}
#case .tabs{display:flex;gap:6px;margin:0 90px 14px 0;flex-wrap:wrap}#case .tabs button{background:#fffaf2;color:#5d5049;border-color:#5d5049}#case .tabs button.on{background:#f2b25c}
#case .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:8px 0 18px}
#case .stat{background:#fffaf2;border:3px solid #5d5049;border-radius:14px;padding:10px;text-align:center}#case .stat b{display:block;font-size:24px}#case .stat small{color:#8a7768}
#case .chart{display:flex;gap:8px;align-items:flex-end;height:130px;background:#fffaf2;border:3px solid #5d5049;border-radius:14px;padding:10px 12px 26px;margin:8px 0 18px}
#case .chart div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative}
#case .chart i{display:block;width:100%;background:#f2b25c;border-radius:6px 6px 0 0;min-height:2px}#case .chart span{font-size:11px;color:#5d5049}#case .chart small{position:absolute;bottom:-20px;color:#8a7768;font-size:11px}
#case .list{display:flex;flex-direction:column;gap:6px;margin:8px 0 18px}#case .list>div{display:flex;align-items:center;gap:10px;background:#fffaf2;border:2px solid #5d5049;border-radius:12px;padding:6px 12px}
#case .list img{height:30px}#case .list span{flex:1}#case .list small{color:#8a7768}
#case .rew{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin:8px 0 18px}
#case .rew>div{display:flex;gap:10px;align-items:center;background:#fffaf2;border:3px solid #d8cbbd;border-radius:14px;padding:10px;opacity:.75}
#case .rew>div.ok{border-color:#5d5049;opacity:1;background:#fff3d6}#case .rew .ic{font-size:28px;filter:grayscale(1)}#case .rew .ok .ic{filter:none}
#case .rew>div>div{flex:1;min-width:0}#case .rew b{display:block}#case .rew small{color:#8a7768;display:block;font-size:12px}
#case .rew i{display:block;height:6px;background:#eadfd2;border-radius:3px;margin-top:5px;overflow:hidden}#case .rew u{display:block;height:100%;background:#f2b25c}
#case .rew em{font-style:normal;font-weight:700;font-size:13px;color:#8a7768}#case .rew .ok em{color:#4c9a3c}
#pill{display:none}
body.phone #pill{display:block;cursor:pointer;max-width:calc(100vw - 180px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;position:fixed;top:calc(14px + env(safe-area-inset-top));left:14px;padding:6px 12px;border-radius:999px;font:600 13px system-ui;background:#fffaf2e6;color:#5d5049;border:2px solid #5d5049}
#pill.d{background:#e0533f;color:#fff;border-color:#a83426}#pill.g{background:#f2b25c;border-color:#b9802f}#pill.off{opacity:.7}
body.phone.dist #phoneBar{background:#b8434b;color:#fff1ee}
body.phone.dist #phoneSub{color:#ffd3cc}
body.phone{transition:background .8s}
body.phone.dist{background:#c9545a}
.panel code{display:block;background:#f6ecdf;color:#5d5049;padding:8px 10px;border-radius:8px;word-break:break-all;margin:6px 0;font-size:13px}
.panel input{width:min(420px,100%)}
.panel a{color:#a8651a}
.panel a.dl{display:inline-block;background:var(--accent);color:#3a2610;border:1px solid var(--accent-d);padding:8px 14px;border-radius:999px;font-weight:700;text-decoration:none;margin:6px 0}
.tasks button.on{border-color:var(--bad);color:var(--bad);background:#fdeceb}
.tasks{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.steps{display:grid;gap:12px;margin-top:14px}.steps section{border:1px solid var(--line);border-radius:16px;padding:14px 16px;background:#fff}
.steps h3{margin:0 0 8px;font-size:15px}.steps .muted{margin:8px 0}.phoneRow{display:flex;gap:14px;align-items:center}
.steps code+button,.steps details button{margin-top:4px}
#qr{background:#fff;padding:8px;border-radius:8px;display:inline-block;margin-top:6px}
#job .jobhead{font-size:15px}
#jobbar{position:relative;height:14px;background:#f1e2cf;border-radius:7px;margin-top:6px;overflow:hidden;cursor:ew-resize;touch-action:none}
.tick{position:absolute;top:0;bottom:0;width:2px;background:#fffaf2}
#steps{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
#steps span{padding:4px 11px;border-radius:999px;background:#f6ecdf;color:var(--muted);font-size:13px}
#steps span.done{color:var(--good)}
#steps span.now{background:var(--accent);color:#3a2610;font-weight:600}
#jobbar.drag #jobfill{transition:none;background:#f7d08a}
#jobfill{height:100%;width:0;background:var(--accent);transition:width .3s}

@media (orientation:portrait){body.phone canvas{width:100vw;aspect-ratio:5/4;object-fit:cover;object-position:92% 50%}}
@media (orientation:landscape){
  body.phone{flex-direction:row;justify-content:flex-start}
  body.phone canvas{width:min(100vw - 240px, 177.7dvh);aspect-ratio:16/9;object-fit:contain;margin:0}
  body.phone #phoneBar{left:auto;right:0;top:0;bottom:0;width:240px;display:flex;flex-direction:column;justify-content:center;padding:16px calc(16px + env(safe-area-inset-right)) 16px 18px;border-top:0;border-left:3px solid #5d5049;text-align:left}
  body.phone #phoneTask{white-space:normal;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical}
  body.phone #pill{left:12px;right:auto;top:auto;bottom:calc(12px + env(safe-area-inset-bottom))}
}
/* bottom bar tucked away until swiped up (side panel in landscape: swipe left) */
body.phone #phoneBar{transition:transform .35s ease,background .8s;touch-action:none}
#grab{display:block;width:44px;height:5px;border-radius:3px;background:#5d504966;margin:-6px auto 10px}
body.phone:not(.barOpen) #phoneBar{transform:translateY(calc(100% - 22px - env(safe-area-inset-bottom)))}
body.phone canvas{transition:margin .35s,width .35s}
@media (orientation:portrait){body.phone:not(.barOpen) canvas{margin-bottom:0}}
@media (orientation:landscape){
  #grab{position:absolute;left:7px;top:50%;width:5px;height:44px;margin:-22px 0 0}
  body.phone:not(.barOpen) #phoneBar{transform:translateX(calc(100% - 22px))}
  body.phone:not(.barOpen) canvas{width:min(100vw - 22px, 177.7dvh)}
}

/* goal ring, level */
.kpi.goal{flex-direction:row;align-items:center;gap:8px;background:none;border:0;padding:0;text-align:left;color:inherit;cursor:pointer}
.kpi.goal span{display:flex;flex-direction:column;line-height:1.15}.kpi.goal svg{width:34px;height:34px;transform:rotate(-90deg)}
.kpi.goal circle{fill:none;stroke-width:4.5}.kpi.goal .bg{stroke:#f1e2cf}.kpi.goal .fg{stroke:var(--accent-d);stroke-linecap:round;stroke-dasharray:94.25;transition:stroke-dashoffset .6s}
.kpi.goal.done .fg{stroke:var(--good)}.kpi.goal:hover{background:none}
.kpi.lvl i{display:block;width:120px;height:6px;border-radius:3px;background:#f1e2cf;margin:5px 0 3px;overflow:hidden}.kpi.lvl u{display:block;height:100%;background:var(--accent)}
/* shop */
#case .shopg{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin:8px 0 18px}
#case .shopc{background:#fffaf2;border:2px solid #e3d2bd;border-radius:16px;padding:12px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
#case .shopc.own{border-color:#5d5049}#case .shopc img.ic{height:56px;max-width:100px;object-fit:contain}#case .shopc .ic{font-size:34px;line-height:1.1}#case .shopc small{color:#8a7768;min-height:2.4em}
#case .shopc button{margin-top:4px;min-width:90px}#case .shopc button:disabled{opacity:.45;cursor:not-allowed}#case .shopc em{font-style:normal;color:var(--good);font-weight:700;margin-top:6px}
/* newspaper */
#case .news{background:#fffdf7;border:2px solid #5d5049;border-radius:6px;padding:20px 24px;font-family:Georgia,'Times New Roman',serif;max-width:820px}
#case .masthead{text-align:center;border-bottom:3px double #5d5049;margin-bottom:12px}#case .masthead h1{margin:2px 0 8px;font-size:40px;letter-spacing:.02em}
#case .news h2{font-size:26px;margin:6px 0}#case .news .lede{font-size:17px;line-height:1.5}#case .news .cols p{margin:6px 0;font-size:15px}
#case .news .stats .stat,#case .news .chart{font-family:system-ui}

/* phone: one tidy dock of round icon buttons under the status pill */
#dock{display:none}
body.phone #dock{display:flex;position:fixed;z-index:11;top:calc(8px + env(safe-area-inset-top));right:12px;gap:4px;padding:4px;background:#fffaf2e6;border:2px solid #5d5049;border-radius:999px;box-shadow:0 4px 14px #5d50491a}
body.phone #dock>button{position:static!important;display:grid!important;place-items:center;width:40px;height:40px;padding:0;border:0!important;border-radius:50%;background:transparent!important;font-size:19px;line-height:1;color:#5d5049}
body.phone #dock>button:active{background:#f6e6cf!important}
body.phone #dock>button.off{opacity:.45}
body.phone #dock>button[hidden]{display:none!important}
body.phone #gear{width:44px;height:44px;padding:0;border-radius:50%;font-size:20px}
@media (orientation:landscape){
  body.phone #dock{top:calc(10px + env(safe-area-inset-top));left:12px;right:auto}
}
/* ---- game HUD + menu ---- */
.hudbtn{border-radius:14px;padding:9px 14px;font-weight:600;white-space:nowrap}
#menu h3{margin:18px 0 8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}#menu h3:first-of-type{margin-top:4px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}@media (max-width:520px){.tiles>button,.tiles>a{padding:10px 4px;font-size:12px}.tiles small{display:none}.tiles i{font-size:22px}}
.tiles>button,.tiles>a{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 8px;border:2px solid var(--line2);border-radius:16px;background:#fff;color:var(--ink);font:600 13px system-ui;text-align:center;text-decoration:none;cursor:pointer}

<script>
const $ = id => document.getElementById(id);
const W = 640, H = 360, cv = $('c'), ctx = cv.getContext('2d');

  hotcross:    {name:'Hot cross buns',  time:50*60, sell:18, unlock:0, batter:'#f0dcb0', stages:[['mix',.15],['knead',.25],['proof',.3],['bake',.3]], months:[2, 3], season:'🌷 Spring'},
  tart:        {name:'Strawberry tart', time:70*60, sell:28, unlock:0, batter:'#f6e3bf', stages:[['mix',.3],['shape',.25],['bake',.45]], months:[5, 6], season:'🍓 Summer'}
};
const inSeason = k => !RECIPES[k].months || RECIPES[k].months.includes(new Date().getMonth());
let lastStage = null;
const STAGE = {mix:'Mixing', shape:'Shaping', knead:'Kneading', proof:'Proofing', bake:'Baking', frost:'Frosting'};
const COUNTER_X = 340, OVEN_X = 420, PROP = {x:290, y:244};

// ---------- state ----------
const newJob = r => ({r, p:0, ruin:0});
const fresh = () => ({coins:0, unlocked:['cookies'], recipe:'cookies', job:newJob('cookies'), shelf:[], day:'', today:0, best:0, baked:0, failed:0});
let S = fresh();
try { const s = JSON.parse(localStorage.getItem('focusbakery-v1')); if (s && s.job && RECIPES[s.job.r]) S = Object.assign(S, s); } catch (e) {}
S.unlocked = Object.keys(RECIPES); // everything unlocked
if (!S.ledger && (S.hist || []).length) S.ledger = S.hist.map(h => ({t:h.t, coins:Math.max(1, Math.round(RECIPES[h.r].sell*(h.q > .85 ? 1 : h.q > .5 ? .75 : .5))), tip:0, r:h.r, c:null}));
setTimeout(showNextReward, 600);   // rewards you haven't collected yet
if (!S.hist) S.hist = (S.shelf || []).map(it => ({r:it.r, q:1 - (it.b || 0), t:Date.now()}));
S.recipe = S.job.r;   // highlighted recipe always matches what's baking
const save = () => { S.savedAt = Date.now(); try { localStorage.setItem('focusbakery-v1', JSON.stringify(S)); } catch (e) {} try { schedulePush(); } catch (e) {} };
setInterval(() => { if (!document.hidden) save(); }, 5000);

let shopClosed = '';
let pcOff = false, trackerRaw = null, trackerWhy = '', manual = null, info = '', distractedSince = 0, streak = 0;
const STATE_URL = location.hostname === 'localhost' ? '/state' : 'http://localhost:8765/state';
// pairing code: links this page to your Mac tracker through the Cloudflare relay
const SITE = location.protocol === 'file:' ? 'https://bakery.ruththomson.workers.dev' : location.origin;
const ls = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } };
let CODE = new URLSearchParams(location.search).get('code') || ls('focusbakery-code');
if (CODE) {
  ls('focusbakery-code', CODE);
  // keep the code in the address so Add to Home Screen carries it (the home-screen app has its own storage)
  const u = new URL(location.href); if (location.protocol !== 'file:' && u.searchParams.get('code') !== CODE) { u.searchParams.set('code', CODE); history.replaceState(null, '', u); }
  document.getElementById('manifest').href = 'manifest.webmanifest?code=' + CODE;
}
// ---- task + focus block shared through the relay (from this page, your phone, or Ritual) ----
function pushTask() {
  clearTimeout(pushTask.t);
  pushTask.t = setTimeout(() => { if (!CODE) return; S.taskT = Date.now(); save();
    fetch(`${SITE}/api/task/${CODE}`, {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({text:S.task || '', id:S.taskId || '', src:S.taskId ? 'todoist' : '', from:'bakery', kind:S.kind || ''})}).catch(() => {}); }, 700);
}
function syncShared(d) {

  const tk = d.task;
  if (tk && tk.t > (S.taskT || 0) + 1500 && document.activeElement !== $('task')) {   // newer task from another device or Ritual
    if ((tk.text || '') !== (S.task || '')) S.taskStart = Date.now();
    S.task = tk.text || ''; S.taskId = tk.src === 'todoist' && tk.id ? tk.id : null; S.taskT = tk.t; S.taskFrom = tk.from;
    S.todo = (S.todo || []).filter(x => !(x.text === S.task || (S.taskId && String(x.ext) === String(S.taskId)))); if (typeof renderTodoList === 'function') renderTodoList();

    if (document.body.classList.contains('phone') && !document.body.classList.contains('barOpen')) {   // show the new task for a moment

    }
  }
  const b = d.block;
  if (b && !b.done && b.end > Date.now() && b.start !== S.blockStart) {   // Ritual started a focus block: bake to match its length
    S.blockStart = b.start;
    const secs = (b.end - b.start)/1000, pick = Object.entries(RECIPES).filter(([, R]) => R.time <= secs + 60).sort((a, c) => c[1].time - a[1].time)[0];
    const k = pick ? pick[0] : 'cookies';
    S.recipe = k; S.job = newJob(k); B.cool = null; lastStage = null; save(); renderRecipes();
    floats.push({x:W/2, y:120, text:`Focus block: ${RECIPES[k].name.toLowerCase()} time!`, t:0});
  }

}
async function poll() {
  if (document.hidden) return;   // app not open: the bakery is closed, so don't keep checking
  try {
    if (CODE) {   // Mac tracker via relay
      const r = await fetch(`${SITE}/api/state/${CODE}`, {cache:'no-store'}); if (!r.ok) throw 0;
      const d = await r.json(), age = (Date.now() - d.t)/1000;
      syncShared(d);
      if (!d.state) { trackerRaw = 'idle'; trackerWhy = 'phone'; pcOff = true; info = 'No computer connected yet · 📱 phone mode: Bingsu stays awake, baking waits for your computer'; return; }
      if (age > 90) { trackerRaw = 'idle'; trackerWhy = 'phone'; pcOff = true; info = `Computer last seen ${fmt(age)} ago · 📱 phone mode: Bingsu stays awake, baking waits for your computer`; return; }   // PC asleep or off: no focus counted, but he stays up with you
      pcOff = false; trackerRaw = d.state; trackerWhy = d.why || ''; info = `${d.devices > 1 ? d.devices + ' computers' : 'Computer'} connected · ${d.state}`; return;
    }
    const r = await fetch(STATE_URL, {cache:'no-store'}); if (!r.ok) throw 0;   // Windows tracker on this PC
    const d = await r.json(); trackerRaw = d.state; info = d.app ? `${d.app} — ${d.title}` : '';
  } catch (e) { trackerRaw = null; }
}
poll(); setInterval(poll, 3000);
function effective(now) {
  const r = manual || trackerRaw || 'focused';
  shopClosed = typeof closedWhy === 'function' ? closedWhy(r) : '';
  if (shopClosed) { distractedSince = 0; return 'idle'; }
  if (r !== 'distracted') { distractedSince = 0; return r; }
  if (!distractedSince) distractedSince = now;
  return now - distractedSince >= (upg('mat') ? 45 : GRACE)*1000 ? 'distracted' : 'grace';
}

// ---------- simulation ----------
function stageOf(job) {
  const R = RECIPES[job.r], f = job.p / R.time; let acc = 0;
  for (const [a, w] of R.stages) { if (f < acc + w) return {a, sp:(f - acc)/w}; acc += w; }
  return {a:R.stages[R.stages.length - 1][0], sp:1};
}
const B = {x:COUNTER_X, mood:'happy', moodT:0, blink:0, nextBlink:2, bubble:null};
const parts = [], floats = [];
const puff = (x, y, n, color, o = {}) => { for (let i = 0; i < n; i++) parts.push({x, y, vx:(Math.random() - .5)*(o.spread || 30), vy:-(o.rise || 20) - Math.random()*15, life:0, max:o.life || 1.2, r:o.r || 4 + Math.random()*4, color, grow:o.grow || 6}); };

// ---- finished! the bake fills the screen on a sunburst and wobbles ----
let CEL = null, lastEff = 'focused';
// rewards wait on screen until you tap to collect them (S.pending survives a reload)
function showNextReward() { const r = (S.pending || [])[0]; CEL = r ? Object.assign({}, r, {t0:performance.now()}) : null; }
function collect() {
  if (!CEL || CEL.got) return;
  CEL.got = performance.now();
  if (!CEL.preview) { S.coins += CEL.coins; S.pending.shift();
    (S.ledger = S.ledger || []).push({t:Date.now(), coins:CEL.coins, tip:CEL.served ? CEL.served.tip : 0, r:CEL.r, c:CEL.served ? CEL.served.c : null}); if (S.ledger.length > 2000) S.ledger.shift();
    save(); }
  coinSound();
}
function coinSound() {
  if (!soundOn || !actx) return;
  [988, 1319, 1568].forEach((f, i) => { const o = actx.createOscillator(), g = actx.createGain(), t0 = actx.currentTime + i*.07;
    o.type = 'square'; o.frequency.value = f; g.gain.setValueAtTime(.06, t0); g.gain.exponentialRampToValueAtTime(.001, t0 + .18); o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0 + .2); });

  if (line) { ctx.strokeText(line, x, y); ctx.fillStyle = '#5d5049'; ctx.fillText(line, x, y); } }
function drawCelebration(now) {
  if (!CEL) return;
  const t = (now - CEL.t0)/1000, out = CEL.got ? (now - CEL.got)/1000 : 0;
  if (out > 1.1) { if (CEL.preview) CEL = null; else showNextReward(); return; }
  const a = Math.min(1, t*4, out ? (1.1 - out)*3 : 1), cx = W/2, cy = H/2 + 6;
  ctx.save(); ctx.globalAlpha = a;
  ctx.fillStyle = '#fff1dc'; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(t*.35);
  for (let i = 0; i < 18; i++) { ctx.fillStyle = i % 2 ? '#ffe2ae' : '#ffd3cc'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, 520, i*Math.PI/9, (i + 1)*Math.PI/9); ctx.closePath(); ctx.fill(); }
  ctx.restore();

  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  for (let i = 0; i < 8; i++) { const an = t*.8 + i*Math.PI/4, r = 150 + Math.sin(t*3 + i)*10, sx = cx + Math.cos(an)*r*1.25, sy = cy + Math.sin(an)*r*.75, k = 4 + 2*Math.sin(t*6 + i);
    ctx.fillStyle = '#ffc94d'; ctx.beginPath(); ctx.moveTo(sx, sy - k*2); ctx.lineTo(sx + k*.6, sy - k*.6); ctx.lineTo(sx + k*2, sy); ctx.lineTo(sx + k*.6, sy + k*.6); ctx.lineTo(sx, sy + k*2); ctx.lineTo(sx - k*.6, sy + k*.6); ctx.lineTo(sx - k*2, sy); ctx.lineTo(sx - k*.6, sy - k*.6); ctx.fill(); }

// ---- break room: while the bakery is closed you can still hang out with Bingsu ----
let breakTouch = 0, petCount = 0;
const breakBusy = () => Date.now() - breakTouch < 45e3 || (VIS && VIS.state !== 'leave');
function scenePt(e) {
  const r = cv.getBoundingClientRect(), cover = getComputedStyle(cv).objectFit === 'cover', k = cover ? Math.max(r.width/W, r.height/H) : Math.min(r.width/W, r.height/H);
  const pos = (getComputedStyle(cv).objectPosition || '50% 50%').split(' ').map(v => parseFloat(v)/100);
  return [(e.clientX - r.left - (r.width - W*k)*(pos[0] || .5))/k, (e.clientY - r.top - (r.height - H*k)*(pos[1] || .5))/k];
}
function breakTap(e) {
  const [x, y] = scenePt(e); breakTouch = Date.now(); $('breakBar').hidden = false;
  if (VIS && VIS.state === 'story') { storyNext(); return true; }
  if (Math.abs(x - B.x) < 75 && y > 90 && y < 250) { petBingsu(x, y); return true; }
  return true;
}
const PURRS = ['purr~', 'mrrp!', '♡', 'prrrr', 'nya~', '*happy wiggle*'];
function petBingsu(x = B.x, y = 150) {
  breakTouch = Date.now(); B.mood = 'joy'; B.moodT = 1.3; petCount++;
  for (let i = 0; i < 6; i++) parts.push({x:x + (Math.random() - .5)*40, y:y - 10, vx:(Math.random() - .5)*60, vy:-50 - Math.random()*50, life:0, max:1.2, r:4 + Math.random()*3, color:'#f7a6b5', grow:2, heart:true});
  floats.push({x:B.x + 60, y:120, text:PURRS[Math.random()*PURRS.length|0], t:0});
  const d = dayLog(); d.pets = (d.pets || 0) + 1;
  if (d.pets % 10 === 0 && (d.petCoins || 0) < 5) { d.petCoins = (d.petCoins || 0) + 1; S.coins++; floats.push({x:B.x, y:100, text:'Bingsu found a coin for you +1 🪙', t:0}); save(); }
}
function drawBreak(now) {
  if (!breakBusy()) { $('breakBar').hidden = true; return; }
  const v = sceneView();
  ctx.fillStyle = 'rgba(253,240,223,.25)'; ctx.fillRect(0, 0, W, H);
  const left = S.breakUntil ? Math.max(0, Math.ceil((S.breakUntil - Date.now())/60e3)) : 0;
  ctx.font = '600 12px system-ui'; ctx.textAlign = 'center'; const tag = S.breakUntil && CUSTOMERS[S.breakWith] ? `☕ Break with ${CUSTOMERS[S.breakWith].name} · ${left}m left` : '☕ Break time · the bakery is closed';
  const tw = ctx.measureText(tag).width + 20, tx = (v.x0 + v.x1)/2; shape('#fffaf2', rr(tx - tw/2, 18, tw, 22, 11), CINK, 1.5); ctx.fillStyle = '#5d5049'; ctx.fillText(tag, tx, 33); ctx.textAlign = 'start';
}
$('breakBar').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return; breakTouch = Date.now();
  if (b.dataset.b === 'pet') petBingsu();
  if (b.dataset.b === 'story') { const who = Object.keys(STORIES2).filter(c => RIGS[c] && (CUSTOMERS[c].lvl || 1) <= level()); if (!who.length) return;
    const c = who[(S.storyTurn = ((S.storyTurn || 0) + 1)) % who.length]; if (VIS && VIS.c !== c) VIS = null; bringIn(c); setTimeout(startStory, 100); }
  if (b.dataset.b === 'open') { $('breakBar').hidden = true; if (S.breakUntil) endBreak(true); else setClosedManual(false); }
});
// ---- breaks with friends: after a good stretch of focus someone invites you to sit with them ----
const wantsBreak = () => (S.sinceBreak || 0) >= 25*60 && !shopClosed && !manual;
function showInvite(c) { $('invTxt').textContent = `${CUSTOMERS[c].name} invites you for a break`; $('invBar').hidden = false; chime(1); }
function declineBreak() { $('invBar').hidden = true; S.sinceBreak = Math.min(S.sinceBreak || 0, 35*60); save(); if (VIS && VIS.state === 'invite') { VIS.state = 'leave'; VIS.t = 0; } }
function startBreakWith(c) {
  $('invBar').hidden = true; S.breakWith = c; S.breakUntil = Date.now() + (S.hours.brk || 5)*60e3; S.sinceBreak = 0;
  setClosedManual(true); breakTouch = Date.now();
  if (!VIS || VIS.c !== c) { VIS = null; bringIn(c); }
  VIS.puppet = true; if (VIS.state === 'invite') { VIS.state = 'wait'; VIS.t = 0; } startStory();   // the visit comes with a story, free
}
function endBreak(early) {
  const c = S.breakWith; S.breakUntil = 0; S.breakWith = null; setClosedManual(false); chime(1);
  if (VIS && VIS.c === c && CUSTOMERS[c]) { const R = RECIPES[CUSTOMERS[c].fav];
    playBeats('', [{who:c, act:early ? 'wave' : 'cheer', say:`Back to it, Bingsu! Save some ${R.name.toLowerCase()} for me!`}], true); }
  save();
}
function breakTick() {
  if (S.breakUntil && Date.now() >= S.breakUntil) { endBreak(false); return; }
  if (S.breakUntil && !S.closedManual) { S.breakUntil = 0; S.breakWith = null; }   // reopened some other way
  // a long stretch with no break: a friend drops by to invite you
  if ((S.sinceBreak || 0) >= 50*60 && !VIS && !shopClosed && !manual && !CEL && $('invBar').hidden) {
    const who = Object.keys(RIGS).filter(c => (CUSTOMERS[c].lvl || 1) <= level() && !(S.orders || []).some(o => o.c === c)); if (!who.length) return;
    const c = who[Math.random()*who.length|0]; bringIn(c); VIS.invite = true; VIS.from = 1;
  }
}
function goalGuest() {   // reaching the daily goal brings a friend with a story
  if ((S.orders || []).length >= MAX_ORDERS) return;
  const who = Object.keys(RIGS).filter(c => (CUSTOMERS[c].lvl || 1) <= level() && STORIES2[c] && !(S.orders || []).some(o => o.c === c)); if (!who.length) return;
  const c = who[Math.random()*who.length|0]; if (spawnOrder(c)) { S.orders[S.orders.length - 1].story = true; floats.push({x:W/2, y:92, text:`🌟 ${CUSTOMERS[c].name} came to celebrate your goal!`, t:0}); }
}
$('invBar').addEventListener('click', e => { const b = e.target.closest('button'); if (!b || !VIS) { $('invBar').hidden = true; return; } if (b.dataset.i === 'yes') startBreakWith(VIS.c); else declineBreak(); });
$('reset').onclick = () => { if (confirm('Reset the bakery? Coins, recipes and bakes will be lost.')) { S = fresh(); save(); renderRecipes(); } };
renderRecipes(); renderModes();

const LABEL = {focused:'Focused', distracted:'Distracted', idle:'Away'};
// the tracker paused the oven because you've been off your kind of work for a while (not because you left)
const pausedWhy = () => manual ? '' : trackerWhy === 'phone' ? '📱 Awake · phone mode' : trackerWhy === 'claude' ? 'Paused · in Claude' : trackerWhy === 'other' ? 'Paused · off task' : '';
function hud(now, eff) {
  $('coins').textContent = S.coins; $('rep').textContent = '★ ' + repStars().toFixed(1);
  const st = $('state'); st.className = eff;
  st.textContent = eff === 'grace' ? `Glancing… ${Math.ceil(GRACE - (now - distractedSince)/1000)}s` : eff === 'idle' && pausedWhy() ? pausedWhy() : LABEL[eff];
  const j = J(), R = RECIPES[j.r], s = stageOf(j), q = Math.round(100*(1 - S.job.ruin/RUIN_FAIL));
  $('jobtext').innerHTML = (preview != null ? '<small>Preview · </small>' : '') + `<b>${R.name}</b> · ${STAGE[s.a]} · ${Math.floor(100*j.p/R.time)}% <small>· quality ${q}% · ${fmt((R.time - S.job.p)/SPEED)} of focus left · focused ${fmt(streak)} in a row</small>`;
  $('jobfill').style.width = (100*j.p/R.time) + '%';
  { const pl = $('pill'), conn = CODE ? (trackerRaw ? '' : pcOff ? ' · 📱 phone mode' : ' · computer offline') : ' · not connected';
    pl.className = eff === 'distracted' ? 'd' : eff === 'grace' ? 'g' : (!CODE || !trackerRaw) && !manual && !pcOff ? 'off' : '';
    pl.textContent = shopClosed ? '☕ On a break · tap to play' : (eff === 'grace' ? `👀 ${Math.ceil(GRACE - (now - distractedSince)/1000)}s` : eff === 'distracted' ? '⚠︎ Distracted' : eff === 'idle' ? (pausedWhy() ? pausedWhy().replace(' · phone mode', '') : '💤 Away') : '● Focused') + `  ·  🪙 ${S.coins}  ·  🎯 ${Math.round(goalProgress()*100)}%`; }
  if (document.body.classList.contains('phone')) {
    const pt = $('phoneTask'), task = (S.task || '').trim();
    pt.textContent = task ? '📝 ' + task : 'Tap to pick a task'; pt.className = task ? '' : 'empty';
    $('phoneProg').firstChild.style.width = (100*j.p/R.time) + '%';
    $('phoneSub').textContent = `🔥${dayStreak()} · ${R.name} · ${STAGE[s.a]} · ${fmt((R.time - S.job.p)/SPEED)} left · ${eff === 'grace' ? 'glancing…' : eff === 'distracted' ? '⚠︎ distracted' : eff === 'idle' ? (pausedWhy() ? pausedWhy().toLowerCase() : 'away') : 'focused ' + fmt(streak)}`;
    document.body.classList.toggle('dist', eff === 'distracted');
  }
  const key = j.r + s.a;
  if (hud.key !== key) {   // step chips + stage markers on the bar
    hud.key = key; let acc = 0, ticks = '', past = true;
    const ICON = {mix:'🥣', shape:'🫳', knead:'👐', proof:'⏳', bake:'🔥', frost:'🎂'};
    $('steps').innerHTML = R.stages.map(([a, w], i) => {
      const cls = a === s.a ? 'now' : past ? 'done' : ''; if (a === s.a) past = false;
      if (i) ticks += `<i class="tick" style="left:${acc*100}%"></i>`; acc += w;
      return `<span class="${cls}">${cls === 'done' ? '✓' : ICON[a]} ${STAGE[a]}</span>`;
    }).join('') + '<span>✨ Cool &amp; serve</span>';
    $('jobbar').querySelectorAll('.tick').forEach(e => e.remove()); $('jobbar').insertAdjacentHTML('beforeend', ticks);
  }
  $('src').textContent = manual ? 'Demo mode (manual state)' : CODE ? (info || 'Connecting…') : trackerRaw ? `Tracker: ${info}` : 'No computer connected yet';
  if (renderRecipes.coins !== S.coins) { renderRecipes.coins = S.coins; renderRecipes(); }
}

let last = performance.now(), hudT = 0;
function loop(now) {
  const rdt = Math.min(.25, (now - last)/1000); last = now;
  const day = new Date().toDateString(); if (S.day !== day) { S.day = day; S.today = 0; S.best = 0; S.shelf = []; S.baked = 0; }
  const eff = effective(now), sim = eff === 'grace' ? 'focused' : eff;
  lastEff = sim; update(rdt, eff === 'grace' ? 'grace' : sim, now); drama(now, eff); if (preview == null) updateCustomers(rdt, sim);
  B.mood = eff === 'grace' && B.moodT <= 0 ? 'glance' : B.mood; if (eff === 'grace' && B.moodT <= 0) B.bubble = '?';
  if (sim === 'focused') { S.today += rdt; streak += rdt; S.best = Math.max(S.best, streak);
    if (!manual) { S.sinceBreak = (S.sinceBreak || 0) + rdt; } }
  else if (sim === 'distracted') streak = 0;
  breakTick();
  if (preview == null && !manual) { progressTick(rdt, sim); if (sim !== 'idle') maybeSpecial(rdt*SPEED); }
  trackComeback(eff === 'grace' ? 'grace' : sim);
  for (let i = parts.length - 1; i >= 0; i--) { const p = parts[i]; p.life += rdt; p.x += p.vx*rdt; p.y += p.vy*rdt; if (p.g) p.vy += p.g*rdt; if (p.life >= p.max) parts.splice(i, 1); }
  for (let i = floats.length - 1; i >= 0; i--) if ((floats[i].t += rdt/1.5) >= 1) floats.splice(i, 1);
  draw(now, eff);
  if ((hudT += rdt) > .25) { hudT = 0; hud(now, eff); renderGoalHud(); }
  if (shopClosed !== loop.wasClosed) { loop.wasClosed = shopClosed; applyWake(); }
  if (shopClosed && !CEL && !breakBusy()) setTimeout(() => requestAnimationFrame(loop), 1000); else requestAnimationFrame(loop);   // closed: one frame a second
}
requestAnimationFrame(loop);
